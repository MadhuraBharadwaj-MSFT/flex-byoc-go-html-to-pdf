<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom HTML sample</title>
  <style>
    @page { size: A4; margin: 24mm; }
    body {
      color: #172033;
      font-family: "Noto Sans", Arial, sans-serif;
    }
    h1 { color: #635bff; }
    .panel {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      background: #f9fafb;
    }
  </style>
</head>
<body>
  <h1>Hello from custom HTML</h1>
  <p>This file is self-contained and can be posted directly to the sample endpoint.</p>
  <div class="panel">Chromium renders this content inside the Go worker image.</div>
</body>
</html>
